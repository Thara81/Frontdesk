databases:
  - name: frontdesk-db
    plan: free
    databaseName: frontdesk

services:
  - type: web
    name: frontdesk
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DB_ENGINE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: frontdesk-db
          property: connectionString
      - key: DB_CONN_MAX_AGE
        value: "60"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SLA_TIME_ZONE
        value: Asia/Kolkata
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
  - type: cron
    name: frontdesk-close-waiting
    runtime: python
    schedule: "30 14 * * 1-5"
    buildCommand: "python -m pip install -r requirements.txt"
    startCommand: "python manage.py close_waiting_tickets"
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DB_ENGINE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: frontdesk-db
          property: connectionString
      - key: DB_CONN_MAX_AGE
        value: "60"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SLA_TIME_ZONE
        value: Asia/Kolkata
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: frontdesk
          envVarKey: DJANGO_SECRET_KEY
