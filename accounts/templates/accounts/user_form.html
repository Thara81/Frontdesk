{% extends 'base.html' %}{% block title %}{{ title }}{% endblock %}{% block content %}<div class="card"><div class="card-header"><h1 class="h4 mb-0">{{ title }}</h1></div><div class="card-body"><form method="post" novalidate>{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="text-danger small mt-1">{{ field.errors|join:" " }}</div>{% endif %}</div>{% endfor %}<button class="btn btn-primary">Save</button></form></div></div>{% endblock %}
